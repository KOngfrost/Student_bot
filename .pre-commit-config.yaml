# Pre-commit хуки — автоматическая проверка перед каждым коммитом
# Установка: pip install pre-commit && pre-commit install

repos:
  # Версии хуков согласованы с requirements-dev.txt (ruff==0.6.9, mypy==1.11.2)
  - repo: https://github.com/astral-sh/ruff-pre-commit
    rev: v0.6.9
    hooks:
      - id: ruff
        args: [--fix, --exit-non-zero-on-fix]
      - id: ruff-format

  - repo: https://github.com/pre-commit/mirrors-mypy
    rev: v1.11.2
    hooks:
      - id: mypy
        additional_dependencies:
          - types-bleach
          - SQLAlchemy[mypy]
        files: ^core/|^web/|^bots/

  - repo: https://github.com/gitleaks/gitleaks
    rev: v8.28.0
    hooks:
      - id: gitleaks
