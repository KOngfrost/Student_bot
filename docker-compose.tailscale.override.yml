# Override для доступа к веб-панели через Tailscale (с HTTPS).
#
# Использование:
#   ./scripts/setup_tailscale.sh
# (или вручную: docker compose -f docker-compose.yml -f docker-compose.tailscale.override.yml \
#    --profile tailscale up -d && затем включить tailscale serve)
#
# Панель доступна ТОЛЬКО внутри вашей tailnet-сети по адресу:
#   https://student-bot-panel.<ваш-tailnet>   (HTTPS через tailscale serve)
# Наружу (в интернет) панель не публикуется вообще.
#
# Требуется Docker Compose >= 2.24 (тег !reset) и TAILSCALE_AUTH_KEY в .env.
# SESSION_HTTPS_ONLY=true в .env — кука Secure, работает с HTTPS.

services:
  web-admin:
    # Убираем публикацию порта на хост — трафик идёт только через tailnet
    ports: !reset []
    # Присоединяем сетевой стек контейнера к Tailscale
    network_mode: "service:tailscale"
    depends_on:
      db:
        condition: service_healthy
      migrate:
        condition: service_completed_successfully
      tailscale:
        condition: service_started

  tailscale:
    # Нужен command, чтобы включить serve после старта; но сделать это
    # надёжнее через setup_tailscale.sh (там есть ожидание и проверка).
    profiles: ["tailscale"]
