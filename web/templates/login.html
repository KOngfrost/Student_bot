{% extends "base.html" %}
{% block title %}Вход - OSS Web Panel{% endblock %}

{% block content %}
<div class="login-container">
    <div class="login-card">
        <div class="login-brand">
            <div class="monogram">OB</div>
            <div>
                <h1>OSS Bot</h1>
                <div class="subtitle">Вход в oss-web-panel</div>
            </div>
        </div>
        
        {% if error %}
        <div class="alert alert-error">{{ error }}</div>
        {% endif %}
        
        <form method="POST" action="/auth/login">
            <input type="hidden" name="csrf_token" value="{{ csrf_token }}">
            <div class="form-group">
                <label for="username">Логин</label>
                <input type="text" id="username" name="username" required autofocus autocomplete="username" placeholder="Введите логин">
            </div>
            <div class="form-group">
                <label for="password">Пароль</label>
                <input type="password" id="password" name="password" required autocomplete="current-password" placeholder="Введите пароль">
            </div>
            <button type="submit" class="btn btn-primary btn-full">Войти</button>
        </form>
    </div>
</div>
{% endblock %}
