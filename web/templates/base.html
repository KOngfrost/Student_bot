<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{% block title %}Admin Panel{% endblock %}</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Manrope:wght@400;500;600;700;800&display=swap" rel="stylesheet">
    <meta name="csrf-token" content="{{ csrf_token|default('') }}">
    <link rel="stylesheet" href="/static/style.css">
    <script>
        // Применяем тему до отрисовки, чтобы не было «вспышки» светлой темы
        (function () {
            var theme = localStorage.getItem('theme');
            if (theme === 'dark' || (!theme && window.matchMedia('(prefers-color-scheme: dark)').matches)) {
                document.documentElement.setAttribute('data-theme', 'dark');
            }
        })();
    </script>
    {% block extra_css %}{% endblock %}
</head>
<body>
    <div class="container">
        {% if user %}
        <aside class="sidebar">
            <div class="sidebar-header">
                <div class="brand">
                    <div class="monogram">SB</div>
                    <div>
                        <div class="brand-name">Student Bot</div>
                        <div class="brand-sub">Админ-панель</div>
                    </div>
                </div>
                <div class="user-info">
                    <span>{{ user.username or 'Admin' }}</span>
                    <form method="post" action="/auth/logout" style="display:inline;">
                        <input type="hidden" name="csrf_token" value="{{ csrf_token|default('') }}">
                        <button type="submit" class="btn-logout">Выйти</button>
                    </form>
                </div>
            </div>
            <div class="nav-label">Разделы</div>
            <nav class="sidebar-nav">
                <a href="/" class="nav-link {% if active == 'dashboard' %}active{% endif %}"><span class="ico">◆</span>Дашборд</a>
                <a href="/tickets/" class="nav-link {% if active == 'tickets' %}active{% endif %}"><span class="ico">▤</span>Заявки</a>
                <a href="/admin/admins/" class="nav-link {% if active == 'admins' %}active{% endif %}"><span class="ico">◍</span>Админы</a>
                <a href="/knowledge/" class="nav-link {% if active == 'knowledge' %}active{% endif %}"><span class="ico">▣</span>База знаний</a>
                <a href="/faq/" class="nav-link {% if active == 'faq' %}active{% endif %}"><span class="ico">◈</span>FAQ</a>
                <a href="/events/" class="nav-link {% if active == 'events' %}active{% endif %}"><span class="ico">◉</span>События</a>
                <a href="/logs/" class="nav-link {% if active == 'logs' %}active{% endif %}"><span class="ico">≡</span>Логи</a>
            </nav>
            <button class="theme-toggle" id="theme-toggle" type="button" title="Переключить тему">
                <span id="theme-icon">☾</span>
                <span id="theme-label">Тёмная тема</span>
            </button>
        </aside>
        {% endif %}
        <main class="main-content">
            {% block content %}{% endblock %}
        </main>
    </div>
    <script>
        // Переключение светлой/тёмной темы с сохранением выбора
        (function () {
            var toggle = document.getElementById('theme-toggle');
            if (!toggle) return;
            var icon = document.getElementById('theme-icon');
            var label = document.getElementById('theme-label');

            function sync() {
                var dark = document.documentElement.getAttribute('data-theme') === 'dark';
                icon.textContent = dark ? '☀' : '☾';
                label.textContent = dark ? 'Светлая тема' : 'Тёмная тема';
            }
            sync();

            toggle.addEventListener('click', function () {
                var dark = document.documentElement.getAttribute('data-theme') === 'dark';
                if (dark) {
                    document.documentElement.removeAttribute('data-theme');
                    localStorage.setItem('theme', 'light');
                } else {
                    document.documentElement.setAttribute('data-theme', 'dark');
                    localStorage.setItem('theme', 'dark');
                }
                sync();
            });
        })();

        // CSRF: устанавливаем заголовок для всех fetch-запросов
        (function () {
            var token = document.querySelector('meta[name="csrf-token"]');
            if (!token) return;
            window.CSRF_TOKEN = token.getAttribute('content');

            var originalFetch = window.fetch;
            window.fetch = function (url, options) {
                options = options || {};
                options.headers = options.headers || {};
                if (!options.headers['X-CSRF-Token'] && window.CSRF_TOKEN) {
                    options.headers['X-CSRF-Token'] = window.CSRF_TOKEN;
                }
                return originalFetch.call(this, url, options);
            };
        })();
    </script>
    {% block extra_js %}{% endblock %}
</body>
</html>
