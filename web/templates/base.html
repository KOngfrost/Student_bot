<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{% block title %}Admin Panel{% endblock %}</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Manrope:wght@400;500;600;700;800&display=swap" rel="stylesheet">
    <meta name="csrf-token" content="{{ csrf_token|default('') }}">
    <link rel="stylesheet" href="/static/style.css">
    <script nonce="{{ request.state.script_nonce|default('') }}">
        // Применяем тему до отрисовки, чтобы не было «вспышки» светлой темы
        (function () {
            var theme = localStorage.getItem('theme');
            if (theme === 'dark' || (!theme && window.matchMedia('(prefers-color-scheme: dark)').matches)) {
                document.documentElement.setAttribute('data-theme', 'dark');
            }
        })();
    </script>
    <script nonce="{{ request.state.script_nonce|default('') }}">
        // Переключение светлой/тёмной темы с сохранением выбора
        (function () {
            var toggle = document.getElementById('theme-toggle');
            if (!toggle) return;
            var icon = document.getElementById('theme-icon');
            var label = document.getElementById('theme-label');

            function sync() {
                var dark = document.documentElement.getAttribute('data-theme') === 'dark';
                icon.textContent = dark ? '☀' : '☾';
                label.textContent = dark ? 'Светлая тема' : 'Тёмная тема';
            }
            sync();

            toggle.addEventListener('click', function () {
                var dark = document.documentElement.getAttribute('data-theme') === 'dark';
                if (dark) {
                    document.documentElement.removeAttribute('data-theme');
                    localStorage.setItem('theme', 'light');
                } else {
                    document.documentElement.setAttribute('data-theme', 'dark');
                    localStorage.setItem('theme', 'dark');
                }
                sync();
            });
        })();

        // CSRF: устанавливаем заголовок для всех fetch-запросов
        (function () {
            var token = document.querySelector('meta[name="csrf-token"]');
            if (!token) return;
            window.CSRF_TOKEN = token.getAttribute('content');

            var originalFetch = window.fetch;
            window.fetch = function (url, options) {
                options = options || {};
                options.headers = options.headers || {};
                if (!options.headers['X-CSRF-Token'] && window.CSRF_TOKEN) {
                    options.headers['X-CSRF-Token'] = window.CSRF_TOKEN;
                }
                return originalFetch.call(this, url, options);
            };
        })();
    </script>
    </head>
<body>
    {% block content %}{% endblock %}
</body>
{% block extra_js %}{% endblock %}
<script nonce="{{ request.state.script_nonce|default('') }}">
document.addEventListener('click', function (event) {
    var open = event.target.closest('[data-open-modal]');
    var close = event.target.closest('[data-close-modal]');
    if (open) document.getElementById(open.dataset.openModal).classList.add('active');
    if (close) document.getElementById(close.dataset.closeModal).classList.remove('active');
});
document.addEventListener('change', function (event) {
    if (event.target.matches('[data-filter-table]') && typeof window.filterTable === 'function') window.filterTable();
    if (event.target.matches('[data-toggle-answer]') && typeof window.toggleAnswer === 'function') window.toggleAnswer();
});
document.addEventListener('submit', function (event) {
    var message = event.target.dataset.confirm;
    if (message && !window.confirm(message)) event.preventDefault();
});
</script>
</html>
