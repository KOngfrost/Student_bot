[mypy]
python_version = 3.11
ignore_missing_imports = True
check_untyped_defs = False
warn_unused_ignores = False
exclude = venv|alembic/versions
# Официальный плагин SQLAlchemy: корректная типизация legacy-стиля
# Column[T] (иначе mypy видит Column[str] там, где в рантайме str)
plugins = sqlalchemy.ext.mypy.plugin
