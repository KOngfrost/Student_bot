services:
  db:
    image: postgres:16-alpine
    container_name: student_bot_db
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:?POSTGRES_USER is required}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?POSTGRES_PASSWORD is required}
      POSTGRES_DB: ${POSTGRES_DB:?POSTGRES_DB is required}
    volumes:
      - postgres_data_recovered:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 30s

  # Одноразовый контейнер миграций: схема изменяется только через Alembic.
  # bot и web-admin стартуют только после успешного завершения.
  migrate:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: student_bot_migrate
    restart: "no"
    env_file:
      - .env
    command: python -m alembic upgrade head
    depends_on:
      db:
        condition: service_healthy

  bot:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: student_bot_app
    restart: unless-stopped
    env_file:
      - .env
    environment:
      - HEARTBEAT_FILE=/tmp/student_bot_heartbeat
    command: python main.py
    healthcheck:
      # Бот обновляет heartbeat-файл при обработке событий и раз в минуту
      test: ["CMD", "python", "scripts/healthcheck_bot.py"]
      interval: 60s
      timeout: 10s
      retries: 3
      start_period: 60s
    depends_on:
      db:
        condition: service_healthy
      migrate:
        condition: service_completed_successfully

  web-admin:
    build:
      context: .
      dockerfile: Dockerfile.web
    container_name: student_bot_web
    restart: unless-stopped
    env_file:
      - .env
    # Панель доступна только с самого сервера (SSH-туннель).
    # Для доступа через Tailscale см. docker-compose.tailscale.override.yml
    ports:
      - "127.0.0.1:8000:8000"
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/health"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 30s
    depends_on:
      db:
        condition: service_healthy
      migrate:
        condition: service_completed_successfully

  # Tailscale: панель доступна только внутри вашей tailnet-сети.
  # Включение: docker compose -f docker-compose.yml -f docker-compose.tailscale.override.yml --profile tailscale up -d
  # Требуется TAILSCALE_AUTH_KEY в .env (https://login.tailscale.com/admin/settings/keys)
  tailscale:
    image: tailscale/tailscale:latest
    container_name: student_bot_tailscale
    restart: unless-stopped
    profiles: ["tailscale"]
    hostname: student-bot-panel
    environment:
      - TS_AUTHKEY=${TAILSCALE_AUTH_KEY:?TAILSCALE_AUTH_KEY is required for tailscale profile}
      - TS_STATE_DIR=/var/lib/tailscale
      - TS_USERSPACE=true
    volumes:
      - tailscale_state:/var/lib/tailscale
    healthcheck:
      test: ["CMD", "tailscale", "status"]
      interval: 30s
      timeout: 5s
      retries: 3

volumes:
  postgres_data:
  postgres_data_recovered:
  tailscale_state:
