# Ruff-конфигурация: lint + formatting
# Пакеты правил:
#   E/W — pycodestyle (стиль кода)
#   F — pyflakes (F401 unused imports, F841 unused vars)
#   B — flake8-bugbear (ловушки для багов)
#   C901 — mccabe (cyclomatic complexity)
#   UP — pyupgrade (современный синтаксис)
#   PERF — perflint (производительность)
line-length = 120
target-version = "py311"

[lint]
select = ["E4", "E7", "E9", "F", "B", "C901", "UP", "PERF"]
ignore = [
    "F403",  # 'from module import *' — не используем
    "PERF203", # try/except in loop — допустимо в некоторых местах
]

[lint.per-file-ignores]
# Jinja-шаблоны и скрипты не линтуются
"alembic/versions/*" = ["E", "F"]
# Патч vkbottle должен выполниться до импортов бота
"bots/vk/bot.py" = ["E402"]
"tests/*" = ["E402"]
# Тесты: assert и magic values допустимы
"tests/**/*" = ["S101", "PLR2004"]
