# Минимальная конфигурация ruff: ошибки времени выполнения и неиспользуемый код
line-length = 120
target-version = "py311"

[lint]
select = ["E4", "E7", "E9", "F"]

[lint.per-file-ignores]
# Jinja-шаблоны и скрипты не линтуруются
"alembic/versions/*" = ["E", "F"]
# Патч vkbottle должен выполниться до импортов бота
"bots/vk/bot.py" = ["E402"]
"tests/*" = ["E402"]
